<section class="page-hero"><p class="eyebrow">Client View</p><h1>Start a REBOUND session.</h1><p class="lead">Manual therapy controls let the client start, pause, stop, adjust intensity, and choose sleeve zones.</p></section>
<main class="app-shell"><aside class="glass side-panel"><h2 style="font-size:2rem">Assigned Plan</h2><div id="clientPlan"></div></aside><section class="dashboard-grid"><div class="glass body-map"><div class="human"><div class="head"></div><div class="torso"></div><button class="limb arm-l active" title="Left Arm"></button><button class="limb arm-r active" title="Right Arm"></button><button class="limb leg-l active" title="Left Leg"></button><button class="limb leg-r active" title="Right Leg"></button></div></div><div class="glass"><p class="status-pill" id="therapyStatus">Ready</p><h2 style="font-size:2.6rem">Manual Controls</h2><div class="session-display" id="timer">00:00</div><div class="control-row"><label>Intensity</label><input type="range" id="intensity" min="0" max="100" value="60"><b id="intensityVal">60%</b></div><div class="progress"><div class="bar" id="outputVal" style="width:60%"></div></div><div class="field" style="margin-top:22px"><label>Sleeve Zone</label><select id="zoneSelect"><option>Full Recovery System</option><option>Arms Only</option><option>Legs Only</option><option>Left Side</option><option>Right Side</option></select></div><p class="muted">Selected Zone: <b id="selectedZone">Full Recovery System</b></p><div class="hero-actions"><button class="btn" id="startTherapy">Start</button><button class="btn secondary" id="pauseTherapy">Pause</button><button class="btn secondary" id="stopTherapy">Stop / Save</button></div></div></section></main><div class="toast"></div><script src="../js/main.js"></script><script src="../js/client.js"></script></body></html>
